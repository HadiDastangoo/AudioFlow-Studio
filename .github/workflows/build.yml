name: Build AudioFlow Studio Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name="AudioFlow-Studio" --icon="icon.ico" --add-data "Vazirmatn.ttf;." --collect-binaries imageio_ffmpeg --hidden-import="clr" --hidden-import="webview.platforms.winforms" --hidden-import="mutagen.id3" --hidden-import="win32clipboard" app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AudioFlow-Studio-Windows-x64
        path: dist/AudioFlow-Studio.exe
