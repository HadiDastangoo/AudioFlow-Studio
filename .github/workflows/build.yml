name: Build & Release AudioFlow Studio

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --name="AudioFlow-Studio" --icon="icon.ico" --add-data "Vazirmatn.ttf;." --collect-binaries imageio_ffmpeg --hidden-import="clr" --hidden-import="webview.platforms.winforms" --hidden-import="mutagen.id3" --hidden-import="win32clipboard" app.py

    - name: Rename Executable with Version Tag
      shell: bash
      run: |
        TAG_NAME="${{ github.ref_name }}"
        if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
          VERSION_SUFFIX="v.1.1.0"
        else
          VERSION_SUFFIX=$(echo "$TAG_NAME" | sed 's/^v\([0-9]\)/v.\1/')
        fi
        mv dist/AudioFlow-Studio.exe "dist/AudioFlow-Studio_${VERSION_SUFFIX}.exe"

    - name: Upload Exe to Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/AudioFlow-Studio_*.exe
